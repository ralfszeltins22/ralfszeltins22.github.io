<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-Movies - Discontinued</title>
<style>
  :root {
    --bg-color: #000000;
    --text-color: #ffffff;
    --accent-color: #ffffff;
    --muted-color: #999999;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
  }

  .container {
    max-width: 600px;
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 700;
    color: var(--accent-color);
    margin-bottom: 1.2rem;
    letter-spacing: -0.5px;
  }

  p.subtitle {
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    color: var(--muted-color);
    margin-bottom: 2rem;
    line-height: 1.5;
  }

  .countdown-wrap {
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    margin-bottom: 1.5rem;
  }

  #countdown {
    color: var(--text-color);
    font-weight: 700;
  }

  a.redirect-link {
    display: inline-block;
    color: var(--accent-color);
    text-decoration: none;
    font-size: 1rem;
    border-bottom: 1px solid var(--accent-color);
    padding-bottom: 2px;
    transition: opacity 0.2s ease;
  }

  a.redirect-link:hover {
    opacity: 0.75;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Z-Movies is discontinued</h1>
  <p class="subtitle">Redirecting to an alternative streaming platform</p>
  <div class="countdown-wrap">
    Redirecting in <span id="countdown">5</span> seconds...
  </div>
  <a class="redirect-link" href="https://popcornmovies.io/">Click here if you are not redirected automatically</a>
</div>

<script>
  (function () {
    var seconds = 5;
    var destination = "https://popcornmovies.io/";
    var countdownEl = document.getElementById("countdown");
    var redirected = false;

    function doRedirect() {
      if (redirected) return;
      redirected = true;
      window.location.replace(destination);
    }

    var timer = setInterval(function () {
      seconds -= 1;
      if (seconds <= 0) {
        countdownEl.textContent = "0";
        clearInterval(timer);
        doRedirect();
      } else {
        countdownEl.textContent = seconds;
      }
    }, 1000);

    // Fallback in case setInterval-based redirect is blocked/delayed
    setTimeout(doRedirect, 5500);
  })();
</script>

</body>
</html>
